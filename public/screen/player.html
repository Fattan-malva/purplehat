<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purplehat - Player</title>
  <link rel="stylesheet" href="screen.css">
  <script src="/shared/protocol.js"></script>
</head>
<body class="immersive">
  <button id="screen-logout" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>

  <div id="player-wrapper">
    <div id="player"></div>
    <div id="idle-screen">
      <div class="brand-logo idle-logo"><i class="fas fa-hat-wizard"></i></div>
      <div class="idle-title">PURPLE<span>HAT</span></div>
      <div class="idle-text"><i class="fas fa-music"></i> Menunggu lagu berikutnya...</div>
    </div>
  </div>

  <!-- Elemen info tersembunyi agar sinkronisasi state tetap jalan -->
  <div style="display:none">
    <div id="now-playing"></div>
    <div id="queue-count"></div>
    <div id="status"></div>
    <div id="overlay"></div>
    <ul id="queue-list"></ul>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="screen.js"></script>
</body>
</html>
