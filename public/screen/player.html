<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purplehat - Player</title>
  <script>
    // Hemat performa HANYA di Android WebView: pasang kelas .ph-android sebelum
    // render, supaya screen.css bisa mematikan backdrop-filter & animasi
    // background yang berat. Windows/WebView2 tidak tersentuh.
    (function () {
      var ua = navigator.userAgent || '';
      var plat = (navigator.userAgentData && navigator.userAgentData.platform) || '';
      if (/Android/i.test(ua) || /Android/i.test(plat)) {
        document.documentElement.classList.add('ph-android');
      }
    })();
  </script>
  <link rel="stylesheet" href="screen.css?v=20261010g">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="/shared/protocol.js?v=20261010c"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body class="immersive">
  <div class="screen-top-right">
    <div id="room-badge" class="room-badge">Kode Room: <span id="room-code-badge">-</span></div>
    <button id="screen-logout" class="logout-btn" title="Logout" aria-label="Logout"><i class="fas fa-sign-out-alt"></i></button>
  </div>

  <div id="player-wrapper">
    <!-- Penadah: iframe ini memuat youtube/player-yt.html ATAU soundcloud/player-sc.html.
         Dokumen diganti total saat pindah sumber, sehingga pemutar lama pasti berhenti. -->
    <iframe id="player-frame" class="hidden" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
    <div id="idle-screen">
      <div class="brand-logo idle-logo"><i class="fas fa-hat-wizard"></i></div>
      <div class="idle-title">PURPLE<span>HAT</span></div>
      <div class="idle-text"><i data-lucide="music" class="icon-glow"></i> Menunggu lagu berikutnya...</div>
    </div>
  </div>

  <!-- Elemen info tersembunyi agar sinkronisasi state tetap jalan -->
  <div style="display:none">
    <div id="now-playing"></div>
    <div id="queue-count"></div>
    <div id="status"></div>
    <div id="overlay"></div>
    <ul id="queue-list"></ul>
  </div>

  <script src="screen.js?v=20261010g"></script>
  <script>if (window.lucide) lucide.createIcons();</script>
</body>
</html>
