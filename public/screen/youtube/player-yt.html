<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purplehat - YouTube Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
    #click-hint {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, .65); color: #fff; cursor: pointer;
      font: 600 20px 'Poppins', sans-serif; letter-spacing: .5px;
      gap: 18px;
    }
    #click-hint .hint-btn {
      width: 84px; height: 84px; border-radius: 50%; background: #a855f7;
      box-shadow: 0 12px 40px rgba(168, 85, 247, .5);
      position: relative;
    }
    #click-hint .hint-btn::after {
      content: ""; position: absolute; top: 50%; left: 54%;
      transform: translate(-50%, -50%);
      border-left: 26px solid #fff;
      border-top: 16px solid transparent;
      border-bottom: 16px solid transparent;
    }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    var player = null;
    var volume = 80;

    function post(m) {
      try { parent.postMessage(Object.assign({ ph: 1 }, m), '*'); } catch (e) {}
    }

    function sendState() {
      if (!player || !player.getPlayerState) return;
      try {
        var s = player.getPlayerState();
        post({
          type: 'state',
          playing: s === YT.PlayerState.PLAYING,
          position: player.getCurrentTime() || 0,
          duration: player.getDuration() || 0
        });
      } catch (e) {}
    }

    // Putar video dengan suara langsung (tanpa trik mute/unmute yang dulu
    // malah bisa menjeda saat buffering). Kalau autoplay diblokir browser
    // (belum pernah ada gesture), tampilkan overlay "klik untuk memutar"
    // di DALAM frame -> klik = gesture asli, sehingga boleh bersuara.
    var fallbackTimer = null;

    function forcePlay() {
      if (!player || !player.playVideo) return;
      clearTimeout(fallbackTimer);
      try { player.playVideo(); } catch (e) {}
      // Kalau setelah 2.5 detik masih belum jalan/buffering, kemungkinan
      // autoplay diblokir -> tampilkan overlay klik
      fallbackTimer = setTimeout(function () {
        try {
          var s = player.getPlayerState ? player.getPlayerState() : -1;
          if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) ensureHint();
        } catch (e) {}
      }, 2500);
    }

    function ensureHint() {
      if (document.getElementById('click-hint')) return;
      var hint = document.createElement('div');
      hint.id = 'click-hint';
      hint.innerHTML = '<div class="hint-btn"></div><div>Klik untuk memutar</div>';
      hint.addEventListener('click', function () {
        try { player.unMute(); player.playVideo(); } catch (e) {}
        removeHint();
      });
      document.body.appendChild(hint);
    }

    function removeHint() {
      var hint = document.getElementById('click-hint');
      if (hint) hint.remove();
      clearTimeout(fallbackTimer);
    }

    // Perintah dari halaman induk (player.html)
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || !d.ph) return;
      switch (d.cmd) {
        case 'load':
          removeHint();
          if (d.volume != null) {
            volume = d.volume;
            try { if (player) player.setVolume(volume); } catch (err) {}
          }
          if (player && player.loadVideoById) {
            player.loadVideoById({ videoId: d.videoId, suggestedQuality: 'hd720' });
            setTimeout(forcePlay, 600);
          }
          break;
        case 'play':
          forcePlay();
          break;
        case 'gesture':
          // Klik user di layar induk -> play langsung (tanpa hint)
          removeHint();
          forcePlay();
          break;
        case 'pause':
          try { player.pauseVideo(); } catch (e) {}
          break;
        case 'seek':
          try { player.seekTo(Math.max(0, d.to || 0)); } catch (e) {}
          break;
        case 'volume':
          volume = d.vol;
          try { player.setVolume(volume); } catch (e) {}
          break;
        case 'replay':
          try { player.seekTo(0); } catch (e) {}
          forcePlay();
          break;
        case 'stop':
          try { player.stopVideo(); } catch (e) {}
          break;
      }
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          fs: 1
        },
        events: {
          onReady: function () {
            try { player.setVolume(volume); } catch (e) {}
            // Izinkan autoplay pada iframe YouTube (penting untuk WebView)
            try {
              var iframe = document.querySelector('#player iframe');
              if (iframe) iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
            } catch (e) {}
            post({ type: 'ready' });
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              post({ type: 'ended' });
            } else if (e.data === YT.PlayerState.PLAYING) {
              removeHint();
            } else if (e.data === YT.PlayerState.CUED || e.data === YT.PlayerState.UNSTARTED) {
              forcePlay();
            }
            sendState();
          },
          onError: function (e) {
            // 2/5/100/101/150 -> video tidak bisa diputar, induk lanjut ke berikutnya
            post({ type: 'error', code: e.data });
          }
        }
      });
      setInterval(sendState, 1000);
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  </script>
</body>
</html>
