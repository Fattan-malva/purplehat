<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purplehat - YouTube Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script>
    var player = null;
    var volume = 80;

    function post(m) {
      try { parent.postMessage(Object.assign({ ph: 1 }, m), '*'); } catch (e) {}
    }

    function sendState() {
      if (!player || !player.getPlayerState) return;
      try {
        var s = player.getPlayerState();
        post({
          type: 'state',
          playing: s === YT.PlayerState.PLAYING,
          position: player.getCurrentTime() || 0,
          duration: player.getDuration() || 0
        });
      } catch (e) {}
    }

    // Putar video; kalau autoplay diblokir browser, mute dulu
    // lalu unmute setelah benar-benar jalan (penting untuk WebView)
    function forcePlay() {
      if (!player || !player.playVideo) return;
      try { player.playVideo(); } catch (e) {}
      setTimeout(function () {
        try {
          var s = player.getPlayerState ? player.getPlayerState() : -1;
          if (s !== YT.PlayerState.PLAYING) {
            player.mute();
            player.playVideo();
            var iv = setInterval(function () {
              try {
                if (player.getPlayerState() === YT.PlayerState.PLAYING) {
                  clearInterval(iv);
                  player.unMute();
                }
              } catch (e) { clearInterval(iv); }
            }, 300);
          }
        } catch (e) {}
      }, 800);
    }

    // Perintah dari halaman induk (player.html)
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || !d.ph) return;
      switch (d.cmd) {
        case 'load':
          if (d.volume != null) {
            volume = d.volume;
            try { if (player) player.setVolume(volume); } catch (err) {}
          }
          if (player && player.loadVideoById) {
            player.loadVideoById({ videoId: d.videoId, suggestedQuality: 'hd720' });
            setTimeout(forcePlay, 600);
          }
          break;
        case 'play':
          forcePlay();
          break;
        case 'pause':
          try { player.pauseVideo(); } catch (e) {}
          break;
        case 'seek':
          try { player.seekTo(Math.max(0, d.to || 0)); } catch (e) {}
          break;
        case 'volume':
          volume = d.vol;
          try { player.setVolume(volume); } catch (e) {}
          break;
        case 'replay':
          try { player.seekTo(0); } catch (e) {}
          forcePlay();
          break;
        case 'stop':
          try { player.stopVideo(); } catch (e) {}
          break;
      }
    });

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%', width: '100%',
        playerVars: {
          autoplay: 1,
          controls: 0,
          modestbranding: 1,
          rel: 0,
          playsinline: 1,
          iv_load_policy: 3,
          fs: 1
        },
        events: {
          onReady: function () {
            try { player.setVolume(volume); } catch (e) {}
            // Izinkan autoplay pada iframe YouTube (penting untuk WebView)
            try {
              var iframe = document.querySelector('#player iframe');
              if (iframe) iframe.setAttribute('allow', 'autoplay; encrypted-media; picture-in-picture; fullscreen');
            } catch (e) {}
            post({ type: 'ready' });
          },
          onStateChange: function (e) {
            if (e.data === YT.PlayerState.ENDED) {
              post({ type: 'ended' });
            } else if (e.data === YT.PlayerState.CUED || e.data === YT.PlayerState.UNSTARTED) {
              forcePlay();
            }
            sendState();
          },
          onError: function (e) {
            // 2/5/100/101/150 -> video tidak bisa diputar, induk lanjut ke berikutnya
            post({ type: 'error', code: e.data });
          }
        }
      });
      setInterval(sendState, 1000);
    }
    window.onYouTubeIframeAPIReady = onYouTubeIframeAPIReady;
    var tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    document.head.appendChild(tag);
  </script>
</body>
</html>
