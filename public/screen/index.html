<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Purplehat - Connect Screen</title>
  <link rel="stylesheet" href="screen.css">
  <script src="/shared/protocol.js"></script>
</head>
<body>
  <div class="container menu-container">
    <header class="brand">
      <div class="brand-logo"><i class="fas fa-hat-wizard"></i></div>
      <h1>PURPLE<span>HAT</span></h1>
    </header>

    <div class="pair-banner glass-panel">
      <div class="pair-code">Kode Pairing: <span id="join-code">-</span></div>
      <img id="qr-img" alt="QR Pairing">
      <div id="status">Status: Menyiapkan...</div>
    </div>

    <div class="promo-slider">
      <div class="slides" id="slides">
        <div class="slide slide-1">
          <h2>🎤 Karaoke Bareng</h2>
          <p>Hubungkan HP kamu & mulai nyanyi sekarang.</p>
        </div>
        <div class="slide slide-2">
          <h2>🎶 Antrian Pintar</h2>
          <p>Pilih lagu, atur urutan, tanpa rebutan mic.</p>
        </div>
        <div class="slide slide-3">
          <h2>🔥 Malam Karaoke</h2>
          <p>Ajak teman & keluarga, party jadi makin seru!</p>
        </div>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="menu.js"></script>
</body>
</html>
