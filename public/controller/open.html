<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#07060b">
    <title>Purplehat - Membuka</title>
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
</head>

<body>
    <!-- Titik masuk peluncuran protocol handler (manifest.protocol_handlers).
         Dibuka aplikasi saat ada yang memanggil web+purplehat:pair/KODE.
         Tugasnya hanya meneruskan kode pairing ke controller, lalu menutup
         diri (dalam app standalone tidak ada gate lagi). -->
    <script>
        (function () {
            // Bentuk p dari manifest: /controller/open.html?p=pair/KODE
            var p = (new URLSearchParams(location.search).get('p') || '');

            // Normalisasi: "pair/KODE", "web+purplehat:pair/KODE", atau KODE mentah
            p = p.replace(/^web\+purplehat:/i, '').replace(/^purplehat:/i, '').replace(/^\/+/, '');

            var pair = '';
            var m = p.match(/^pair\/(.+)$/i);
            if (m) pair = m[1];
            else if (/^[A-Za-z0-9-]+$/.test(p)) pair = p;

            pair = pair.toUpperCase().trim();
            try { if (pair) localStorage.setItem('ph_last_code', pair); } catch (e) {}

            var qs = pair ? ('?pair=' + encodeURIComponent(pair)) : '';
            location.replace('index.html' + qs);
        })();
    </script>
</body>

</html>
