<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#07060b">
    <meta name="color-scheme" content="dark">
    <title>Purplehat - Membuka</title>

    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="controller.css">
</head>

<body class="splash-body">

    <!-- Halaman pendaratan pertama saat QR di layar player di-scan dari HP.
         Tugasnya hanya menyimpan kode pairing, lalu meneruskan ke gerbang
         instalasi (gate-install.html) SEBELUM tampilan controller. -->
    <main class="splash">
        <div class="logo splash-logo"><i class="fas fa-hat-wizard"></i></div>
        <h1 class="brand-name">PURPLE<span>HAT</span></h1>
        <span id="splash-code" class="pill hidden"></span>
        <p class="hint">Membuka Purplehat…</p>
        <span class="gate-spinner" aria-hidden="true"></span>
    </main>

    <script>
        (function () {
            const pair = (new URLSearchParams(location.search).get('pair') || '').toUpperCase().trim();
            if (pair) localStorage.setItem('ph_last_code', pair);

            const codeEl = document.getElementById('splash-code');
            if (pair && codeEl) {
                codeEl.textContent = 'Room ' + pair;
                codeEl.classList.remove('hidden');
            }

            // Simpan sesi scan -> gerbang instalasi
            localStorage.setItem('ph_gate_pending', '1');

            const qs = pair ? '?pair=' + encodeURIComponent(pair) : '';
            setTimeout(() => location.replace('gate-install.html' + qs), 500);
        })();
    </script>
</body>

</html>
